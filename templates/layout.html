<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyShop — Premium Billing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <header class="app-topbar">
      <div class="app-topbar-inner">
        <a class="app-brand" href="/"><i class="bi bi-lightning-charge-fill me-1"></i>MyShop</a>
        <nav class="app-toplinks" aria-label="Primary">
          <a href="/"><i class="bi bi-grid me-1"></i>Shop</a>
          <a href="/cart"><i class="bi bi-cart3 me-1"></i>Cart <span class="top-pill">{{ cart_count or 0 }}</span></a>
          <a href="/invoices"><i class="bi bi-receipt me-1"></i>Invoices</a>
          <a href="/admin/products"><i class="bi bi-gear me-1"></i>Admin</a>
        </nav>
      </div>
    </header>
    <aside class="app-sidebar" aria-hidden="false">
      <div class="sidebar-inner d-flex flex-column align-items-center py-3">
        <a class="sidebar-item {{ 'active' if request.path == '/' else '' }}" href="/" title="Shop"><i class="bi bi-grid-fill"></i></a>
        <a class="sidebar-item {{ 'active' if request.path.startswith('/cart') else '' }}" href="/cart" title="Cart"><i class="bi bi-cart-fill"></i></a>
        <a class="sidebar-item {{ 'active' if request.path.startswith('/invoices') or request.path.startswith('/invoice/') else '' }}" href="/invoices" title="Invoices"><i class="bi bi-receipt"></i></a>
        <a class="sidebar-item {{ 'active' if request.path.startswith('/order/') else '' }}" href="/invoices" title="Orders"><i class="bi bi-box-seam"></i></a>
        <a class="sidebar-item {{ 'active' if request.path.startswith('/admin') else '' }}" href="/admin/products" title="Admin"><i class="bi bi-gear-fill"></i></a>
        <div class="sidebar-spacer"></div>
      </div>
    </aside>
    <main class="app-main container-fluid px-4 px-lg-5 py-4">
      {% block hero %}{% endblock %}
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-success app-alert shadow-sm"><i class="bi bi-check-circle me-2"></i>{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
      <footer class="text-center text-muted small mt-5 pb-3">MyShop Premium Billing • GST-ready • PDF • Payments • Stock</footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
