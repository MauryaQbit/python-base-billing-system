{% extends "layout.html" %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Admin - Products</h3>
    <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#addProduct">Add Product</button>
  </div>

  <div class="collapse mb-4" id="addProduct">
    <div class="card card-body">
      <form method="post">
        <div class="row g-2">
          <div class="col-md-6">
            <input name="name" class="form-control" placeholder="Product name" required>
          </div>
          <div class="col-md-3">
            <input name="price" type="number" step="0.01" class="form-control" placeholder="Price" required>
          </div>
          <div class="col-md-3">
            <input name="image_url" class="form-control" placeholder="Image URL (optional)">
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-success">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    {% for p in products %}
    <div class="col">
      <div class="card h-100 shadow-sm">
        {% if p.image_url %}
          <img src="{{ p.image_url }}" class="card-img-top product-img" alt="{{ p.name }}">
        {% endif %}
        <div class="card-body">
          <h5 class="card-title">{{ p.name }}</h5>
          <p class="card-text">${{ '%.2f'|format(p.price) }}</p>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
{% endblock %}
